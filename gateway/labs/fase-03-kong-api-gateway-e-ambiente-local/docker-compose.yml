name: gateway-phase-03

services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    networks:
      - gateway-lab

networks:
  gateway-lab:
    external: true
