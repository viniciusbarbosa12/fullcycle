            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "# MeshCommerce Golden Signals\nGenerate traffic and watch request rate, success, latency and failures change in real time. Metrics come from the existing Istio sidecars; Prometheus stores them and Grafana turns PromQL into an investigation view.",
