apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This opt-in lab is intentionally installed with the stack. Its VirtualService
# affects only requests carrying the dedicated demo header; regular traffic is
# routed without fault injection.
resources:
  - namespace.yaml
  - labs/payments-latency.yaml
  - grafana/configmap.yaml
  - grafana/dashboard.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
