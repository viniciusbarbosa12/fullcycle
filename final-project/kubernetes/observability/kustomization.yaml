apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Payments traffic policy is deployed by the main local-deploy script so a
# single VirtualService owns canary, resilience, and observability lab routes.
resources:
  - namespace.yaml
  - loki/loki.yaml
  - alloy/alloy.yaml
  - alertmanager/alertmanager.yaml
  - alertmanager/receiver.yaml
  - grafana/configmap.yaml
  - grafana/dashboard.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - prometheus/rbac.yaml
  - prometheus/kube-state-metrics.yaml
  - prometheus/configmap.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
