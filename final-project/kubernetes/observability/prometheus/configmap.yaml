apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: meshcommerce
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 4s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: meshcommerce-istio-proxies
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - meshcommerce
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_phase
            regex: Running
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: "true"
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
            regex: (.+)
          - action: replace
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: application
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_version
            target_label: version

  rules.yml: |
    groups:
      - name: meshcommerce-golden-signals
        rules:
          - record: meshcommerce:http_requests:rate1m
            expr: |
              sum by (source_workload, destination_service_name, response_code) (
                rate(
                  istio_requests_total{
                    reporter="source",
                    source_workload_namespace="meshcommerce"
                  }[1m]
                )
              )

          - record: meshcommerce:http_request_duration_milliseconds:p95_1m
            expr: |
              histogram_quantile(
                0.95,
                sum by (source_workload, destination_service_name, le) (
                  rate(
                    istio_request_duration_milliseconds_bucket{
                      reporter="source",
                      source_workload_namespace="meshcommerce"
                    }[1m]
                  )
                )
              )

          # This alert intentionally uses source-side telemetry. An Envoy fault
          # can fail before a destination workload receives the request.
          - alert: MeshCommerceHttp5xxDetected
            expr: |
              sum by (source_workload, destination_service_name) (
                rate(
                  istio_requests_total{
                    reporter="source",
                    source_workload_namespace="meshcommerce",
                    response_code=~"5.."
                  }[1m]
                )
              ) > 0
            for: 10s
            labels:
              severity: warning
            annotations:
              summary: MeshCommerce is returning HTTP 5xx responses
              description: Investigate the source workload, destination service, recent changes, and Istio response flags.
