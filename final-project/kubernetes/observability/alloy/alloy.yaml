apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: meshcommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-meshcommerce-logs
  namespace: meshcommerce
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: meshcommerce
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-meshcommerce-logs
  namespace: meshcommerce
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: meshcommerce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-meshcommerce-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: meshcommerce
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "meshcommerce_pods" {
      role = "pod"

      namespaces {
        names = ["meshcommerce"]
      }
    }

    discovery.relabel "meshcommerce_pods" {
      targets = discovery.kubernetes.meshcommerce_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "application"
      }

      rule {
        replacement  = "meshcommerce"
        target_label = "job"
      }
    }

    loki.source.kubernetes "meshcommerce_pods" {
      targets    = discovery.relabel.meshcommerce_pods.output
      forward_to = [loki.process.meshcommerce.receiver]
    }

    loki.process "meshcommerce" {
      stage.cri {}

      stage.json {
        expressions = {
          level    = "LogLevel",
          category = "Category",
          message  = "Message",
        }
      }

      stage.labels {
        values = {
          level    = "level",
          category = "category",
        }
      }

      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: logs
    app.kubernetes.io/part-of: meshcommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: logs
        app.kubernetes.io/part-of: meshcommerce
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: alloy
          image: grafana/alloy:v1.7.5
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/tmp/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - name: http
              containerPort: 12345
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            - name: data
              mountPath: /tmp/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
