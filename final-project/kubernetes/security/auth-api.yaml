apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api-v1
  namespace: meshcommerce
  labels:
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/component: security-lab
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-api
        app.kubernetes.io/component: security-lab
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: auth-api
          image: meshcommerce/auth-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: Jwt__Viewer__Issuer
              valueFrom:
                secretKeyRef:
                  name: gateway-viewer-jwt
                  key: key
            - name: Jwt__Viewer__Secret
              valueFrom:
                secretKeyRef:
                  name: gateway-viewer-jwt
                  key: secret
            - name: Jwt__Operator__Issuer
              valueFrom:
                secretKeyRef:
                  name: gateway-operator-jwt
                  key: key
            - name: Jwt__Operator__Secret
              valueFrom:
                secretKeyRef:
                  name: gateway-operator-jwt
                  key: secret
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: meshcommerce
spec:
  selector:
    app.kubernetes.io/name: auth-api
  ports:
    - name: http
      port: 8080
      targetPort: http