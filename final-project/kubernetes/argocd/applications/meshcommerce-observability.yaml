apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meshcommerce-observability
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/viniciusbarbosa12/fullcycle.git
    targetRevision: main
    path: final-project/kubernetes/observability
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
