name: meshcommerce

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments-dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-code-first-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - meshcommerce

  payments-migrations:
    image: meshcommerce/payments-migrations:dev
    build:
      context: ./backend
      dockerfile: src/Payments.Migrations/Dockerfile
    environment:
      ConnectionStrings__PaymentsDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-payments};Username=${POSTGRES_USER:-payments};Password=${POSTGRES_PASSWORD:-payments-dev};GSS Encryption Mode=Disable;Timeout=5;Command Timeout=5"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meshcommerce

  payments-api:
    image: meshcommerce/payments-api:dev
    build:
      context: ./backend
      dockerfile: src/Payments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_VERSION: compose
      ELASTIC_APM_SERVICE_NAME: payments-api
      ELASTIC_APM_SERVER_URL: http://elastic-agent:8200
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN}
      ELASTIC_APM_ENVIRONMENT: Development
      ELASTIC_APM_SERVICE_VERSION: compose
      ConnectionStrings__PaymentsDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-payments};Username=${POSTGRES_USER:-payments};Password=${POSTGRES_PASSWORD:-payments-dev};GSS Encryption Mode=Disable;Timeout=5;Command Timeout=5"
    ports:
      - "127.0.0.1:5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payments-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - meshcommerce

  orders-api:
    image: meshcommerce/orders-api:dev
    build:
      context: ./backend
      dockerfile: src/Orders.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_VERSION: compose
      ELASTIC_APM_SERVICE_NAME: orders-api
      ELASTIC_APM_SERVER_URL: http://elastic-agent:8200
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN}
      ELASTIC_APM_ENVIRONMENT: Development
      ELASTIC_APM_SERVICE_VERSION: compose
      Payments__BaseUrl: http://payments-api:8080
      Cors__AllowedOrigins__0: http://localhost:4173
      Cors__AllowedOrigins__1: http://127.0.0.1:4173
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      - payments-api
    restart: unless-stopped
    networks:
      - meshcommerce

  frontend:
    image: meshcommerce/frontend:dev
    build:
      context: ./frontend
      args:
        VITE_ORDERS_API_URL: http://localhost:5101
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - orders-api
    restart: unless-stopped
    networks:
      - meshcommerce

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.5.3}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      node.name: elasticsearch
      cluster.name: meshcommerce-observability
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Local development uses authenticated HTTP bound only to loopback.
      xpack.security.enabled: "true"
      xpack.security.authc.api_key.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9200)" = "401"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - observability

  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.5.3}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        auth_file="$$(mktemp)"
        trap 'rm -f "$${auth_file}"' EXIT
        chmod 600 "$${auth_file}"
        printf 'user = "elastic:%s"\n' "$${ELASTIC_PASSWORD}" > "$${auth_file}"
        for attempt in {1..30}; do
          if printf '{"password":"%s"}' "$${KIBANA_SYSTEM_PASSWORD}" |
            curl --silent --show-error --fail \
              --config "$${auth_file}" \
              --header 'Content-Type: application/json' \
              --request POST \
              --data-binary @- \
              http://elasticsearch:9200/_security/user/kibana_system/_password >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - observability

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.5.3}
    environment:
      # ELASTICSEARCH_HOSTS is the current setting. ELASTICSEARCH_URL is
      # retained to mirror the lesson and is redundant in modern Kibana.
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in .env}
      # Trust the corporate TLS inspection root without disabling validation.
      NODE_EXTRA_CA_CERTS: /usr/share/kibana/config/certs/wex-corporate-root-ca.pem
    volumes:
      - ./certificates/wex-corporate-root-ca.pem:/usr/share/kibana/config/certs/wex-corporate-root-ca.pem:ro
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - observability

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELASTIC_STACK_VERSION:-9.5.3}
    environment:
      FLEET_SERVER_ENABLE: "true"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN: ${FLEET_SERVER_SERVICE_TOKEN:?Set FLEET_SERVER_SERVICE_TOKEN in .env}
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: 8220
      # Local development only. Production requires TLS for Fleet Server.
      FLEET_SERVER_INSECURE_HTTP: "true"
    ports:
      - "127.0.0.1:8220:8220"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8220/api/status >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    restart: unless-stopped
    networks:
      - observability

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELASTIC_STACK_VERSION:-9.5.3}
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_ENROLLMENT_TOKEN: ${FLEET_ENROLLMENT_TOKEN:?Set FLEET_ENROLLMENT_TOKEN in .env}
      # Fleet Server is intentionally HTTP-only in this local Compose stack.
      FLEET_INSECURE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Fleet's Docker log stream filters collection to the two MeshCommerce APIs.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      fleet-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - observability
      - meshcommerce

  synthetics-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELASTIC_STACK_VERSION:-9.5.3}
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_ENROLLMENT_TOKEN: ${SYNTHETICS_ENROLLMENT_TOKEN}
      # Fleet Server is intentionally HTTP-only in this local Compose stack.
      FLEET_INSECURE: "true"
    volumes:
      - synthetics-agent-state:/usr/share/elastic-agent/state
    depends_on:
      fleet-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - observability
      - meshcommerce

volumes:
  postgres-code-first-data:
  synthetics-agent-state:

networks:
  meshcommerce:
    driver: bridge

  observability:
    driver: bridge
