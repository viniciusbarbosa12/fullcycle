openapi: 3.1.0

info:
  title: MeshCommerce Orders API
  version: 1.0.0
  description: >-
    Manages orders and orchestrates their payment through the internal Payments
    API. Orders are currently stored in memory.
  contact:
    name: MeshCommerce API Team
    url: https://github.com/viniciusbarbosa12/fullcycle

servers:
  - url: /api
    description: Same-origin path exposed by the MeshCommerce frontend proxy

tags:
  - name: Orders
    description: Order creation and queries
  - name: Operations
    description: Service identity and health endpoints

paths:
  /:
    get:
      tags:
        - Operations
      summary: Get service identity
      description: Returns the service name, deployed version, and current instance.
      operationId: getOrdersServiceIdentity
      responses:
        "200":
          description: Service identity returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceIdentity"

  /health:
    get:
      tags:
        - Operations
      summary: Check service health
      description: Reports whether the Orders API process is healthy.
      operationId: getOrdersHealth
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: Healthy

  /orders:
    get:
      tags:
        - Orders
      summary: List orders
      description: Returns all orders currently held by this Orders API instance.
      operationId: listOrders
      responses:
        "200":
          description: Orders returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

    post:
      tags:
        - Orders
      summary: Create an order
      description: >-
        Creates an order and requests its payment. If the Payments API is
        unavailable, the order remains pending and the operation returns 503.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created and payment result recorded
          headers:
            Location:
              description: Relative URL of the created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Request validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "503":
          description: Payments API is unavailable and the payment result is unknown
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get an order
      description: Returns one order by its identifier.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Order identifier
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order was not found

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customer
        - item
        - amount
      properties:
        customer:
          type: string
          minLength: 1
          description: Customer name
          example: John
        item:
          type: string
          minLength: 1
          description: Item being purchased
          example: Keyboard
        amount:
          type: number
          minimum: 0.01
          description: Positive order amount
          example: 249.9

    Order:
      type: object
      required:
        - id
        - customer
        - item
        - amount
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          readOnly: true
        item:
          type: string
          readOnly: true
        amount:
          type: number
          minimum: 0.01
          readOnly: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    OrderStatus:
      type: string
      description: Current result of the order payment workflow
      enum:
        - PendingPayment
        - Paid
        - PaymentFailed
      readOnly: true

    ServiceIdentity:
      type: object
      required:
        - service
        - version
        - instance
      properties:
        service:
          type: string
          example: orders-api
        version:
          type: string
          example: v1
        instance:
          type: string
          example: orders-api-v1-66995fb844-7trpr

    ProblemDetails:
      type: object
      description: RFC 7807-compatible error response
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      additionalProperties: true

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
