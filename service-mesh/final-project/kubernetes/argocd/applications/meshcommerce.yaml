apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meshcommerce
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/viniciusbarbosa12/fullcycle.git
    targetRevision: main
    path: service-mesh/final-project/kubernetes/base
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: meshcommerce

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
