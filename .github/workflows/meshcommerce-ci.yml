name: MeshCommerce CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/meshcommerce-ci.yml"
      - "final-project/backend/**"
      - "final-project/frontend/**"
      - "final-project/docker-compose.yml"
      - "final-project/kubernetes/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/meshcommerce-ci.yml"
      - "final-project/backend/**"
      - "final-project/frontend/**"
      - "final-project/docker-compose.yml"
      - "final-project/kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshcommerce-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: final-project/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: final-project/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint frontend
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  integration:
    name: Integrated application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: meshcommerce-ci
    defaults:
      run:
        working-directory: final-project
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start integrated stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Check service health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 2 \
            http://127.0.0.1:5101/health
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 2 \
            http://127.0.0.1:5102/health
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 2 \
            --output /dev/null \
            http://127.0.0.1:4173/

      - name: Exercise paid-order flow
        run: |
          order_response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"customer":"CI","item":"GitOps demo","amount":42.00}' \
              http://127.0.0.1:5101/orders
          )"

          printf '%s\n' "${order_response}"
          if ! grep --quiet --extended-regexp \
            '"status"[[:space:]]*:[[:space:]]*"Paid"' \
            <<< "${order_response}"; then
            echo "The end-to-end order did not reach the Paid state." >&2
            exit 1
          fi

          {
            echo "### MeshCommerce integration"
            echo
            echo "- PostgreSQL migration completed"
            echo "- Orders and Payments health checks passed"
            echo "- Frontend responded successfully"
            echo "- End-to-end order reached the Paid state"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Stop integrated stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Kubernetes resources
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict \
            -summary \
            -verbose \
            -ignore-missing-schemas \
            -ignore-filename-pattern 'values\.yaml$' \
            -kubernetes-version 1.36.0 \
            /workspace/final-project/kubernetes

          {
            echo "### Kubernetes validation"
            echo
            echo "- Built-in resources validated against Kubernetes 1.36 schemas"
            echo "- Unknown custom resources reported as skipped"
            echo "- Kubeconform image pinned by digest"
          } >> "${GITHUB_STEP_SUMMARY}"

  quality-gate:
    name: CI quality gate
    if: always()
    needs:
      - frontend
      - integration
      - manifests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
        run: |
          {
            echo "### MeshCommerce CI quality gate"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Frontend quality | ${FRONTEND_RESULT} |"
            echo "| Integrated application | ${INTEGRATION_RESULT} |"
            echo "| Kubernetes manifests | ${MANIFESTS_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${FRONTEND_RESULT}" != "success" \
            || "${INTEGRATION_RESULT}" != "success" \
            || "${MANIFESTS_RESULT}" != "success" ]]; then
            echo "At least one required CI gate failed." >&2
            exit 1
          fi
