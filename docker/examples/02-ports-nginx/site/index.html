<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docker Ports Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      main {
        max-width: 640px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;

  <body>
    <main>
      <h1>Docker port mapping is working.</h1>
      <p>
