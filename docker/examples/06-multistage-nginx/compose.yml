services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    container_name: docker-example-multistage-api
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: docker-example-multistage-nginx
    depends_on:
      - api
    ports:
      - "8086:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
