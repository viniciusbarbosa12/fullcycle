apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-management-api
spec:
  ingressClassName: nginx
  rules:
    - host: task-management.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-management-api
                port:
                  number: 8080
  tls:
    - hosts:
        - task-management.local
      secretName: task-management-local-tls
