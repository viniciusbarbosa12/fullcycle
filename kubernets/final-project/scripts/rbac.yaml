apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-management-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-management-api-pod-reader
  namespace: default
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-management-api-pod-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: task-management-api
    namespace: default
roleRef:
  kind: Role
  name: task-management-api-pod-reader
  apiGroup: rbac.authorization.k8s.io
